<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Plan de Inversión</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="cuerpo">
        <div class="header">
            <h1>Planificador de Inversión</h1>
        </div>
        <div class="contenedor-datos">
            <div class="contenedor">
                <div class="datos">
                    <div class="nacimiento">
                        <label for="fechaNacimiento">Fecha de nacimiento:</label>
                        <input type="date" id="fechaNacimiento">
                    </div>
                    <div class="salario">
                        <label for="salario">Ingresos mensuales ($):</label>
                        <input type="text" id="salario" placeholder="Ej: 500.000" data-valor="0">
                    </div>
                    <div class="ahorro">
                        <label for="ahorros-totales">Ahorros actuales ($):</label>
                        <input type="text" id="ahorros-totales" placeholder="Ej: 1.500.000" data-valor="0">
                    </div>
                </div>
                <div class="contenedor-resultado">
                    <h2 class="resultado">Resultado:</h2>
                    <div id="mensaje"></div>

                </div> 
            </div>
            <button id="botonCalcular">Calcular Plan</button>
        </div>
    </div>
    
  <script>
    // guardo contantes que ingresa las personas
    const inputFecha = document.getElementById("fechaNacimiento");
    const inputSalario = document.getElementById("salario");
    const inputAhorros = document.getElementById("ahorros-totales");

    const boton = document.getElementById("botonCalcular");
    const mensaje = document.getElementById("mensaje");

    // funcion para agregar los puntos
    function formatearInput(input) {
        input.addEventListener("input", function() {
            let limpio = this.value.replace(/\D/g, '');
            this.dataset.valor = limpio || 0;
            this.value = limpio ? Number(limpio).toLocaleString('de-DE') : '';
        });
    }

    // llamo a la funcion
    formatearInput(inputSalario);
    formatearInput(inputAhorros);

    inputFecha.max = new Date().toISOString().split("T")[0];

    function obtenerEdad(fechaOrigen) {
        const nacimiento = new Date(fechaOrigen + "T00:00:00");
        const hoy = new Date();

        if (isNaN(nacimiento.getTime()) || nacimiento > hoy) {
            return null; 
        }

        let anios = hoy.getFullYear() - nacimiento.getFullYear();
        let meses = hoy.getMonth() - nacimiento.getMonth();
        if (hoy.getDate() < nacimiento.getDate()) meses--;
        
        if (meses < 0) {
            anios--;
            meses += 12;
        }

        return { anios, meses };
    }

    function montoMensual () {
        if (!inputFecha.value) {
            mensaje.innerHTML = `⚠️ <strong>Error:</strong> Por favor, selecciona tu fecha de nacimiento antes de calcular.`;
            return;
        }
        const datosEdad = obtenerEdad(inputFecha.value);
        const { anios, meses } = datosEdad;
        if (anios < 20) {
            mensaje.innerHTML = `🎈 <strong>¡Tenés ${anios} años!</strong> Despreocupate de la plata por ahora, ¡disfrutá tu juventud!`;
            return;
        }

        const salarioVal = Number(inputSalario.dataset.valor) || 0;
        if (salarioVal < 1) {
            mensaje.innerHTML = `⚠️ <strong>Error:</strong> Por favor, ingresa tus ingresos mensuales para poder armar el plan.`;
            return;
        }

        const ahorrosVal = Number(inputAhorros.dataset.valor) || 0;

        const proximaEdadRedonda = (Math.floor(anios / 10) + 1) * 10;
        
        // Meses totales vividos dentro de la década actual (ej: si tienes 25 años y 6 meses, son 5 años y 6 meses = 66 meses)
        const mesesVividosEnDecada = ((anios % 10) * 12) + meses;
        
        // Una década tiene 120 meses en total. El tiempo restante son los meses que faltan para llegar al hito.
        const tiempoRestante = 120 - mesesVividosEnDecada;

        // La meta es acumular 1 año de sueldo por cada década cumplida (12 meses de sueldo por cada bloque de 10 años = 120 meses de sueldo total al llegar al hito)
        const montoFinal = salarioVal * 12; 

        // Restamos ahorros y dividimos exactamente por los meses restantes reales
        const montoMensualCalculado = (montoFinal - ahorrosVal) / tiempoRestante; 

        const fmt = (num) => Math.round(num).toLocaleString('de-DE');

        if (montoMensualCalculado <= 0) {
            mensaje.innerHTML = `🎉 <strong>¡Felicitaciones!</strong> Tus ahorros actuales de $${fmt(ahorrosVal)} ya superan la meta de $${fmt(montoFinal)} requerida para tus ${proximaEdadRedonda} años.`;
        }
        else {
            mensaje.innerHTML = `👉 <strong>Debes ahorrar al mes:</strong> $${fmt(montoMensualCalculado)} durante los próximos <strong>${tiempoRestante} meses</strong> (hasta tus ${proximaEdadRedonda} años) para llegar a los $${fmt(montoFinal)}.`;
        }
    }
    
    boton.addEventListener("click", montoMensual);
  </script>
</body>
</html>
